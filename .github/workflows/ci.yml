name: Docker CI

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]
  # Weekly full rebuild: pushes and PRs build only the images whose files
  # changed, so this keeps every image on fresh base layers and dependencies.
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Override target build platforms (comma-separated). Leave blank to use the default."
        required: false
        default: ""

permissions:
  contents: read

# A newer push to the same PR cancels the superseded run. Runs on master and on
# tags are never cancelled mid-way, so a publish is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BUILD_PLATFORMS: ${{ github.event.inputs.platforms || vars.BUILD_PLATFORMS || 'linux/amd64' }}

jobs:
  quality:
    name: Tests and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # find the last successful run on master
    outputs:
      build_matrix: ${{ steps.images.outputs.build_matrix }}
      has_build: ${{ steps.images.outputs.has_build }}
      retag: ${{ steps.images.outputs.retag }}
      has_retag: ${{ steps.images.outputs.has_retag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build only the images whose inputs changed (.github/ci/images.json).
      # PRs compare with their base, pushes to master with the last successful
      # run on master (so a change from a failed run is never skipped). Tags,
      # the weekly schedule, manual runs and an unknown base build every image.
      # The check fails if a Dockerfile copies a file the config does not list.
      - name: Select changed images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/ci/changed_images.py check
          case "$EVENT/$REF" in
            pull_request/*) python3 .github/ci/changed_images.py select --base "$PR_BASE" ;;
            push/refs/heads/master)
              base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                --branch master --status success --limit 1 --json headSha \
                --jq '.[0].headSha // ""' || true)"
              python3 .github/ci/changed_images.py select --base "$base" ;;
            *) python3 .github/ci/changed_images.py select --all ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit pytest-cov "ruff==0.12.4"

      - name: Python lint
        run: python -m ruff check .

      - name: Python tests
        run: >-
          python -m pytest -q
          --cov=stores --cov=backend-api --cov=scraper --cov=alert-service
          --cov-report=term:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Python dependency audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --coverage

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Repository vulnerability and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Kept whatever the tests did, so a drop in coverage is visible.
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Two-store integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # The tests seed their own database on this server; they never touch the
      # one the application is configured with.
      MONGO_URI: mongodb://localhost:27017/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Integration tests
        run: python -m pytest -q -m integration tests/integration

  build:
    name: Build ${{ matrix.service }}
    needs: [quality, integration]
    if: needs.quality.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the default branch and release tags can use this environment and its publish token.
    environment: ${{ github.event_name != 'pull_request' && 'publish' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize owner to lowercase
        id: vars
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(env.BUILD_PLATFORMS, 'arm')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Unchanged images get this commit's `master` and `sha-` tags pointed at
  # their current image, so every image still carries every master commit's
  # tags (TESCO_IMAGE_TAG pins one tag for all of them). A registry-side
  # retag: nothing is rebuilt.
  retag:
    name: Retag unchanged images
    needs: [quality, integration, build]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.quality.result == 'success' && needs.integration.result == 'success'
      && needs.quality.outputs.has_retag == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Point this commit's tags at the current images
        env:
          RETAG: ${{ needs.quality.outputs.retag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in $(jq -r '.[].image' <<<"$RETAG"); do
            ref="$REGISTRY/$owner/$image"
            docker buildx imagetools create \
              --tag "$ref:master" --tag "$ref:sha-${GITHUB_SHA::7}" "$ref:latest"
            echo "$ref:{master,sha-${GITHUB_SHA::7}} -> $ref:latest"
          done
